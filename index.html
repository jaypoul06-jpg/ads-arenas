<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ads Arena - Home</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="top-bar">
    <div class="user-info">
      <div class="avatar"></div>
      <div>
        <h2>Welcome, User</h2>
        <p>@telegram_id</p>
      </div>
    </div>
  </header>

  <!-- STATS -->
  <section class="stats">
    <div class="card">
      <h3>👁 Ads Watched</h3>
      <p id="adsWatched">0</p>
    </div>

    <div class="card">
      <h3>⭐ Points</h3>
      <p id="points">0</p>
    </div>
  </section>

  <!-- WATCH ADS BUTTON -->
  <section class="action">
    <button id="watchAdsBtn">🟢 WATCH ADS</button>
  </section>

  <!-- REFERRAL CARD -->
  <section class="card wide">
    <h3>👥 Referral Program</h3>
    <p>Invite friends and earn bonus points</p>
    <button>Invite Now</button>
  </section>

  <!-- LEAGUE CARD -->
  <section class="card wide">
    <h3>🏅 League Status</h3>
    <p>Bronze Level</p>
  </section>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="referral.html">Referrals</a>
    <a href="ranking.html">Ranking</a>
    <a href="profile.html">Profile</a>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
